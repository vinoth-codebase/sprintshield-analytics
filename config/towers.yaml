# =============================================================================
# SprintShield Analytics - Organizational Tower Profiles
# =============================================================================
# Each tower declares its committed-vs-completed velocity envelope and the
# operational signature of its unplanned support demand. The synthetic
# generator and the analytics engine both read from this file.
towers:
  - tower_id: DE
    name: Data Engineering
    headcount: 14
    story_points_per_sprint: 96
    gross_hours_per_sprint: 320.0
    arrival:
      # Mean unplanned incidents per sprint (Poisson / NegBinom mu).
      mean_incidents: 7.5
      # Dispersion index target. >1.2 selects the Negative Binomial model.
      dispersion: 1.35
      # Probability that a release window spawns a burst of correlated tickets.
      burst_probability: 0.22
      burst_multiplier: 2.8
    effort:
      # Log-Normal parameters of resolution hours (mu of log, sigma of log).
      lognormal_mu: 1.30
      lognormal_sigma: 0.95
      # Weibull shape/scale used as an alternative fitted family.
      weibull_shape: 1.25
      weibull_scale: 6.5
    assets:
      - { asset: dbt_core_warehouse, weight: 0.32, severity: 1.35 }
      - { asset: airflow_orchestration, weight: 0.26, severity: 1.20 }
      - { asset: kafka_ingestion, weight: 0.22, severity: 1.45 }
      - { asset: snowflake_loader, weight: 0.20, severity: 1.05 }

  - tower_id: DA
    name: Data Analytics
