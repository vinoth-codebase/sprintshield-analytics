[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintshield-analytics"
version = "1.0.0"
description = "Unplanned Support Demand & Developer Capacity Forecaster for multi-tower data organizations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinothkumar N", email = "vinothofficial14@gmail.com" }]
keywords = [
    "capacity-planning",
    "monte-carlo",
    "jira",
    "delta-lake",
    "snowflake",
    "support-tax",
    "sre",
    "data-engineering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "deltalake>=0.17",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "plotly>=5.20",
    "streamlit>=1.30",
    "pillow>=10.0",
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.6",
    "snowflake-sqlalchemy>=1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
sprintshield = "sprintshield.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sprintshield = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=sprintshield --cov-report=term-missing --cov-fail-under=88"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/sprintshield"]
omit = [
    # Streamlit entry point: executed by the Streamlit runtime, not importable.
    "*/dashboard/app.py",
    # Requires a live Snowflake account; every branch is guarded and skipped.
    "*/snowflake_adapter.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
